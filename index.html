<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ef's links</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Neue';
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
            width: 100%;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }
        
        p {
            margin: 0 0 30px;
            color: #666;
            line-height: 1.5;
        }
        .social-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .social-links li {
            margin-bottom: 15px;
        }
        .social-links a {
            display: block;
            padding: 12px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .social-links a:hover {
            background-color: #555;
            transform: translateY(-2px);
        }
        .github { background-color: #24292e !important; }
        .github:hover { background-color: #1b1f23 !important; }
        
        .linkedin { background-color: #FF0033 !important; }
        .linkedin:hover { background-color: #DD0011 !important; }
        
        .instagram { background-color: #e1306c !important; }
        .instagram:hover { background-color: #b02655 !important; }
        
        .twitter { background-color: #1da1f2 !important; }
        .twitter:hover { background-color: #0c85d0 !important; }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #ffffff;
            }
            .container {
                background-color: #1e1e1e;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            }
            p {
                color: #bbbbbb;
            }
        }
		silent-text {
            margin-top: 30px;
            color: #f4f4f9;
            font-size: 14px;
            cursor: default;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #ffffff;
            }
            .container {
                background-color: #1e1e1e;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            }
            p {
                color: #bbbbbb;
            }
            .silent-text {
                color: #121212;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ef</h1>
        <p>:wave:</p>

        <ul class="social-links">
            <li><a href="https://www.tiktok.com/@t0hr_" target="_blank" class="github">TikTok</a></li>
			<li><a href="https://www.instagram.com/cm_eff" target="_blank" class="instagram">Instagram</a></li>
            <li><a href="https://www.youtube.com/@cm_ef" target="_blank" class="linkedin">YouTube</a></li>
            <li><a href="https://twitter.com/cm_eff" target="_blank" class="twitter">Twitter / X</a></li>
        </ul>
    </div>
<p class="silent-text">You found the secret message!</p>
</body>
</html>
