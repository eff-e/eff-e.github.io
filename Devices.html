    body {
      font-family: 'Comic Neue', 'Inter', system-ui, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: #ffffff;
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.25s ease;
    }

    @keyframes fadeInTitle {
      from {
        opacity: 0;
        transform: translateY(-16px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeInContainer {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ef-gradient-title {
      background: linear-gradient(90deg, #a8edea 0%, #c2e9fb 50%, #e0c3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.25));
      animation: fadeInTitle 0.7s ease-out forwards;
    }

    .ef-glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      color: var(--text-primary);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, border-color 0.25s ease, background 0.3s ease;
    }

    .ef-subbox {
      background: var(--subbox-bg);
      border: 1px solid var(--subbox-border);
    }

    .device-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1.25rem;
      animation: fadeInContainer 0.55s ease-out forwards;
    }
    @media (max-width: 1100px) {
      .device-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 820px) {
      .device-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 520px) {
      .device-grid {
        grid-template-columns: repeat(1, minmax(0, 1fr));
      }
    }

    .device-card:hover {
      transform: translateY(-5px);
      border-color: rgba(168, 237, 234, 0.65);
      box-shadow: 0 16px 32px rgba(20, 10, 60, 0.45);
    }

    .text-theme-primary { color: var(--text-primary); }
    .text-theme-secondary { color: var(--text-secondary); }
    .text-theme-muted { color: var(--text-muted); }
    .device-stage { background: var(--stage-bg); }

    const STORAGE_KEY = "ef_my_devices_png_v2";
    let devices = [];

    function loadDevices() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            devices = parsed;
            return;
          }
        }
      } catch (e) {}
      devices = JSON.parse(JSON.stringify(DEFAULT_DEVICES));
    }

    function handleImageError(imgEl) {
      const idx = parseInt(imgEl.getAttribute("data-device-idx"), 10);
      const step = parseInt(imgEl.getAttribute("data-fallback-step") || "0", 10);
      const dev = devices[idx];
      if (dev && Array.isArray(dev.fallbacks) && step < dev.fallbacks.length) {
        imgEl.setAttribute("data-fallback-step", String(step + 1));
        imgEl.src = dev.fallbacks[step];
      } else {
        imgEl.onerror = null;
      }
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderGrid() {
      const grid = document.getElementById("devicesGrid");

      document.getElementById("headerCountLabel").textContent = `${devices.length} Devices in Collection`;

      grid.innerHTML = devices.map((d, idx) => `
        <article class="device-card ef-glass-panel rounded-2xl overflow-hidden flex flex-col justify-between">
          <div>
            <!-- Card Top Bar -->
            <div class="px-4 pt-3.5 flex items-center justify-between">
              <span class="text-[11px] font-mono font-bold px-2.5 py-0.5 rounded-lg ef-subbox text-theme-secondary">
                #${idx + 1} • ${escapeHtml(d.brand)}
              </span>
            </div>

            <!-- Custom PNG Device Image Stage -->
            <div class="px-4 py-4 flex items-center justify-center device-stage my-2 border-y min-h-[170px]" style="border-color: var(--subbox-border);">
              <img
                src="${escapeHtml(d.imageUrl)}"
                alt="${escapeHtml(d.name)}"
                data-device-idx="${idx}"
                data-fallback-step="0"
                loading="lazy"
                class="h-36 w-auto max-w-full object-contain mx-auto drop-shadow-xl hover:scale-105 transition-transform"
                onerror="handleImageError(this)"
              />
            </div>

            <!-- Device Title & Codename Badge (No copy button) -->
            <div class="px-4 pt-1">
              <h3 class="text-base font-bold text-theme-primary leading-snug">${escapeHtml(d.name)}</h3>

              <div class="mt-2 flex items-center justify-between ef-subbox rounded-xl px-3 py-2">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="text-xs font-bold text-theme-secondary">Codename:</span>
                  <code class="text-xs font-mono font-bold text-purple-700 dark:text-purple-300 truncate">${escapeHtml(d.codename)}</code>
                </div>
              </div>
            </div>

            <!-- Software Info Box -->
            <div class="px-4 pt-3 pb-4 text-xs">
              <div class="ef-subbox rounded-xl p-2.5 space-y-1.5">
                <div class="flex items-start justify-between gap-2">
                  <span class="font-bold text-theme-secondary shrink-0">Software:</span>
                  <span class="font-bold text-emerald-700 dark:text-emerald-300 text-right">${escapeHtml(d.rom)}</span>
                </div>
                <div class="flex items-start justify-between gap-2">
                  <span class="font-bold text-theme-secondary shrink-0">Status:</span>
                  <span class="font-bold text-sky-700 dark:text-sky-300 text-right">${escapeHtml(d.status || "Official")}</span>
                </div>
              </div>
            </div>
          </div>
        </article>
      `).join("");
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadDevices();
      renderGrid();

      document.getElementById("brandResetBtn").addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  </script>
